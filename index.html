<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF Reader Admin</title>
    <!-- The reader logo mark, so the tab shows the brand rather than the browser's default
         globe. See public/ for the full favicon_io set this was generated from. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Open Sans and Aleo, per TF_BRAND_GUIDELINES_SHARED.md. Loaded here rather than as an
         npm package: it's a stylesheet reference, not a new dependency. Applied app-wide through
         the --sans/--font-aleo variables in index.css's :root. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Aleo:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined: the icon set used throughout the Stitch designs
         (nav glyphs, status dots, table/action icons). One weight axis (400) is enough --
         every icon in the design system reads at regular weight. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
