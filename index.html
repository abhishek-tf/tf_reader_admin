<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF Reader Admin</title>
    <!-- The circular device from the master logo, so the tab shows the brand mark rather than
         the browser's default globe. See public/favicon.svg. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Sans and Aleo, per TF_BRAND_GUIDELINES_SHARED.md. Loaded here rather than as an
         npm package: it's a stylesheet reference, not a new dependency. Applied app-wide through
         the --sans/--font-aleo variables in index.css's :root. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Aleo:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
