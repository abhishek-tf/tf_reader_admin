<?xml version="1.0" encoding="UTF-8"?>
<!--
  The tab icon: the Taylor and Francis circular device mark.

  Not new artwork. src/assets/tf-logo-indigo.svg is a lockup of two parts — the circular
  device occupying viewBox region 0 0 112 112, and the "Taylor & Francis" wordmark from x=129
  to x=468. The six elements below are that device, copied verbatim from the master file: the
  same path data, the same brand Indigo (#024) and white. Nothing has been redrawn, moved,
  simplified or recoloured. The only change is the viewBox, narrowed from "0 0 468 112" to the
  square the device already occupies, because pointing a favicon at the full lockup squeezes a
  468x112 wordmark into 16px and renders it unreadable.

  Kept in public/ rather than src/assets/ so Vite copies it verbatim to a stable /favicon.svg,
  with no content hash in the name for index.html to chase.

  If the master logo is ever replaced, re-extract these six elements rather than editing them
  here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-label="Taylor and Francis">
  <path d="M56.17.07C25.28.07.24,25.11.24,56s25.04,55.93,55.93,55.93,55.93-25.04,55.93-55.93S87.06.07,56.17.07Z" fill="#024"/>
  <path d="M56.37,46.04s-.5-5.45,6.26-14.13c0,0-16.86,7.37-6.26,14.13Z" fill="#fff"/>
  <polygon points="74.94 50.74 76.05 48.39 37.59 48.39 38.8 50.74 74.94 50.74" fill="#fff"/>
  <polygon points="73.13 55.45 74.34 53.1 39.41 53.1 40.52 55.45 73.13 55.45" fill="#fff"/>
  <path d="M86.05,57.82H24.67v-1.51h-8.18v1.51h-1.92l2.02,4.74h10.2c5.65,10.7,16.86,18.07,29.78,18.07,8.98,0,17.26-3.53,23.22-9.39,15.14,1.21,18.88-16.96,18.88-16.96l-12.62,3.53ZM82.31,68.92c1.11-1.31,2.12-2.73,3.13-4.24,0,0,1.61-2.52,2.52-4.85l7.47-2.02c-4.44,10.2-11.21,11-13.12,11.1Z" fill="#fff"/>
